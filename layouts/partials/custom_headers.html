{{/* Project override: favicon + font preconnect + count-up stats + floating contact buttons. */}}
{{/* Gadjoy brand favicon (overrides the theme's default icon; loads after it). */}}
<link rel="icon" type="image/png" href="{{ "img/logo-small.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "img/apple-touch-icon.png" | relURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
(function () {
  function ready(fn){ document.readyState !== 'loading' ? fn() : document.addEventListener('DOMContentLoaded', fn); }

  ready(function () {
    /* Floating WhatsApp + Call buttons (site-wide) */
    var fab = document.createElement('div');
    fab.className = 'gadjoy-fab';
    fab.innerHTML =
      '<a class="wa" href="https://wa.me/919110624049" target="_blank" rel="noopener" aria-label="WhatsApp Gadjoy"><i class="fab fa-whatsapp"></i></a>' +
      '<a class="call" href="tel:+919110624049" aria-label="Call Gadjoy"><i class="fas fa-phone"></i></a>';
    document.body.appendChild(fab);

    /* Animated count-up for the stats band */
    var nums = [].slice.call(document.querySelectorAll('.num[data-count]'));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function fmt(n){ return n.toLocaleString('en-IN'); }
    function run(el){
      var target = parseInt(el.getAttribute('data-count'), 10) || 0;
      var suffix = el.getAttribute('data-suffix') || '';
      if (reduce) { el.textContent = fmt(target) + suffix; return; }
      var start = null, dur = 1400;
      function step(ts){
        if (!start) start = ts;
        var p = Math.min((ts - start) / dur, 1);
        var eased = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(Math.round(target * eased)) + suffix;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { run(e.target); io.unobserve(e.target); }
        });
      }, { threshold: 0.4 });
      nums.forEach(function (n) { io.observe(n); });
    } else {
      nums.forEach(run);
    }

    /* Gallery lightbox */
    var lb = document.getElementById('gj-lightbox');
    if (lb) {
      var items = [].slice.call(document.querySelectorAll('.gj-wall-item'));
      var imgEl = lb.querySelector('.gj-lb-img');
      var idx = -1;
      function show(i) {
        if (i < 0) i = items.length - 1;
        if (i >= items.length) i = 0;
        idx = i;
        imgEl.src = items[i].getAttribute('data-full');
      }
      function open(i) { show(i); lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
      function close() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; imgEl.src = ''; }
      items.forEach(function (el, i) { el.addEventListener('click', function () { open(i); }); });
      lb.querySelector('.gj-lb-close').addEventListener('click', close);
      lb.querySelector('.gj-lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
      lb.querySelector('.gj-lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') show(idx - 1);
        else if (e.key === 'ArrowRight') show(idx + 1);
      });
    }

    /* Scroll-reveal for .gj-reveal elements (staggered per group) */
    var reveals = [].slice.call(document.querySelectorAll('.gj-reveal'));
    if (!('IntersectionObserver' in window) || reduce) {
      reveals.forEach(function (el) { el.classList.add('no-observer'); });
    } else {
      var ro = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            var el = e.target;
            var sibs = [].slice.call(el.parentNode.children).filter(function (n) { return n.classList.contains('gj-reveal'); });
            el.style.transitionDelay = (sibs.indexOf(el) * 0.09) + 's';
            el.classList.add('in'); ro.unobserve(el);
          }
        });
      }, { threshold: 0.2 });
      reveals.forEach(function (el) { ro.observe(el); });
    }
  });
})();
</script>
